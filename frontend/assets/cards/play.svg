<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow_play" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="196" height="276" x="2" y="2" rx="16" fill="#13141f" stroke="#22c55e" stroke-width="2" stroke-opacity="0.4"/>
  <rect width="188" height="268" x="6" y="6" rx="12" fill="url(#grad_play)"/>

  <rect x="16" y="16" width="60" height="20" rx="6" fill="#22c55e" fill-opacity="0.2"/>
  <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="1">VERB</text>

  <circle cx="100" cy="115" r="46" fill="#22c55e" fill-opacity="0.12" filter="url(#glow_play)"/>
  <circle cx="100" cy="115" r="42" fill="#1e2030" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="100" y="132" font-size="44" text-anchor="middle">⚽</text>

  <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PLAY</text>
  <text x="100" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">ISL SIGN</text>

  <line x1="24" y1="244" x2="176" y2="244" stroke="#22c55e" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <circle cx="100" cy="256" r="3" fill="#22c55e" fill-opacity="0.7"/>
</svg>