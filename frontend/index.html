<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISL 3D Avatar Overlay</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Three.js & GLTFLoader (Offline Capable) -->
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
</head>
<body>
  <div class="overlay-container">
    <!-- Header with window drag handle & quick toggles -->
    <header class="overlay-header">
      <div class="header-title">
        <div id="status-dot" class="status-dot disconnected" title="Disconnected"></div>
        <span class="title-text">ISL 3D Real-Time Overlay</span>
      </div>
      <div class="header-controls">
        <button id="btn-feedback" class="control-btn-icon" title="Flag Missing or Inaccurate Sign for Review">🚩</button>
        <button id="btn-clickthrough" class="control-btn-icon" title="Toggle Click-Through Mode (Ctrl+Shift+T)">⚡</button>
        <button id="btn-minimize" class="control-btn" title="Minimize">−</button>
        <button id="btn-close" class="control-btn close" title="Close">✕</button>
      </div>
    </header>

    <!-- Main Rendering Stage (Dual-Mode: 3D WebGL Canvas & 2D Cards) -->
    <div class="stage-container">
      <canvas id="avatar-canvas"></canvas>
      <div id="card-stage" class="card-stage"></div>
      
      <!-- Feedback notification toast -->
      <div id="feedback-toast" class="feedback-toast">Sign flagged for interpreter review!</div>
    </div>

    <!-- Live Telemetry & Streaming Ticker Ribbon -->
    <div class="ribbon-container">
      <div class="ticker-box">
        <div id="transcription-preview" class="transcription-preview">
          "Listening for system audio or text..."
        </div>
        <div id="telemetry-latency" class="telemetry-latency">
          Latency: <span id="metric-total">0</span>ms (NLP: <span id="metric-nlp">0</span>ms)
        </div>
      </div>
      <div id="gloss-badges" class="gloss-badges"></div>
    </div>

    <!-- Interactive Footer Controls (FR-7, Use-Case 4.2.2) -->
    <footer class="overlay-footer">
      <div class="input-row">
        <input 
          type="text" 
          id="text-input" 
          class="text-input" 
          placeholder="Test sentence (e.g. 'The boy is eating an apple')..." 
        />
        <button id="send-btn" class="send-btn">Sign</button>
        <button id="audio-toggle-btn" class="audio-toggle-btn">
          <span>🎙️</span> System Audio
        </button>

      </div>

      <div class="mode-row">
        <!-- Display Mode Switcher (FR-6, 4.2.2) -->
        <div class="segmented-control">
          <button class="segment-btn" data-mode="avatar">3D Avatar</button>
          <button class="segment-btn" data-mode="card">Cards</button>
          <button class="segment-btn active" data-mode="hybrid">Hybrid</button>
        </div>

        <!-- Controls: Speed, Clothing Theme, Opacity (FR-7) -->
        <div class="controls-group">
          <label for="speed-select">Speed:</label>
          <select id="speed-select" class="speed-select">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>

          <label for="avatar-select">Avatar:</label>
          <select id="avatar-select" class="speed-select" title="Switch 3D Avatar (Hand Talk Hugo / Maya)">
            <option value="hugo" selected>Hugo</option>
            <option value="maya">Maya</option>
          </select>

          <label for="theme-select">Theme:</label>
          <select id="theme-select" class="speed-select">
            <option value="dark" selected>Dark</option>
            <option value="light">Light</option>
          </select>


          <label for="brightness-slider">Brightness:</label>
          <input 
            type="range" 
            id="brightness-slider" 
            min="0.2" 
            max="1.5" 
            step="0.05" 
            value="0.8" 
            class="opacity-slider" 
            title="Model Lighting Brightness (20% - 150%)"
          />

          <label for="opacity-slider">Opacity:</label>
          <input 
            type="range" 
            id="opacity-slider" 
            min="0.3" 
            max="1.0" 
            step="0.05" 
            value="1.0" 
            class="opacity-slider" 
            title="Window Opacity (30% - 100%)"
          />
        </div>
      </div>
    </footer>
  </div>

  <script src="avatar_engine.js"></script>
  <script src="card_sequencer_ui.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
